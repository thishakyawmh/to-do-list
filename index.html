<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Web Application</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/3c2cc2a330.js" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h2>To-Do List<img src="images/icon.png" alt="" aria-hidden="true"></h2>
            <form class="row" id="task-form">
                <div class="input-wrapper">
                    <label class="visually-hidden" for="input-box">New task</label>
                    <input type="text" id="input-box" placeholder="Add your text" maxlength="240" autocomplete="off">
                </div>
                <button type="submit">Add</button>
            </form>
            <p id="task-status" class="task-status" role="status" aria-live="polite"></p>
            <ul id="list-container" aria-label="Your tasks">
                <!--<li class="checked">Task 01</li>
                <li>Task 02</li>
                <li>Task 03</li>-->
            </ul>
            <div class="copyright">
                Copyright © To-do List <i class="fa-solid fa-code"></i> <a href="https://691xtck4llxg2o9mgcnobq.on.drv.tw/Thish/" >By Thish.</a>
            </div>
        </div>
        
    </div>
<script type="module" src="script.js"></script>

</body>
</html>
